<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NETK05 Mock Exam Interactive Quiz</title>
<style>
:root{--bg:#dff3ff;--card:#ffffffcc;--ink:#172033;--blue:#2563eb;--ok:#dcfce7;--bad:#fee2e2;--a:#fff7cc;--b:#d9f99d;--c:#bae6fd;--d:#fbcfe8;}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);}
.wrap{max-width:980px;margin:0 auto;padding:24px 14px 80px} header{text-align:center;margin:8px 0 18px} h1{margin:.2rem 0;font-size:clamp(1.5rem,4vw,2.4rem)}
.card{background:var(--card);border-radius:22px;box-shadow:0 10px 28px #1d4ed820;padding:22px;border:1px solid #c6e7ff} .progress{font-weight:700;color:#0f4c81;margin-bottom:12px}
.question{font-size:1.25rem;line-height:1.45;font-weight:800;margin:12px 0 18px} .images{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px;margin:12px 0 20px}
.imgbox{background:#fff;border-radius:14px;padding:10px;text-align:center;border:1px solid #d7eafe;min-height:145px;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.imgbox img{max-width:100%;max-height:120px;object-fit:contain} .imgbox span{font-size:.88rem;font-weight:700;margin-top:6px}
.choices{display:grid;gap:12px} button.choice{width:100%;text-align:left;border:2px solid transparent;border-radius:16px;padding:14px 16px;font-size:1rem;cursor:pointer;color:#121827;transition:.15s;box-shadow:0 4px 10px #00000010}
button.choice:hover{transform:translateY(-1px);border-color:#4299e1} .choice .letter{display:inline-block;font-weight:900;margin-right:8px;min-width:24px} .a{background:var(--a)} .b{background:var(--b)} .c{background:var(--c)} .d{background:var(--d)}
.choice.correct{background:var(--ok)!important;border-color:#16a34a} .choice.wrong{background:var(--bad)!important;border-color:#dc2626} .choice:disabled{cursor:not-allowed;opacity:.96}
.feedback{min-height:50px;margin:18px 0 4px;font-size:1.08rem} .icon{font-size:2.2rem;vertical-align:middle;margin-right:8px} .explain{background:#eff6ff;border-left:6px solid var(--blue);padding:14px;border-radius:12px;margin-top:12px;line-height:1.5}
.nav{display:flex;justify-content:flex-end;margin-top:20px} .next,.restart{background:#0f67b1;color:white;border:0;border-radius:999px;padding:13px 20px;font-size:1rem;font-weight:800;cursor:pointer} .next:disabled{background:#9bbcd8;cursor:not-allowed}
.summary{text-align:center} .score{font-size:3rem;font-weight:900;color:#0f67b1;margin:12px} .small{font-size:.95rem;color:#475569} footer{text-align:center;margin-top:18px;font-weight:700;color:#436275}
</style></head><body><div class="wrap"><header><h1>NETK05 Mock Exam</h1><div class="small">Interactive self-marking revision quiz</div></header><main id="app"></main><footer>Developed for tutorwarren.com learning resources</footer></div>

o perform better under fire conditions than ordinary PVC cables."}, {"q": "Which statement is true regarding thermosetting cables?", "choices": ["These cables can withstand ambient operating temperature of 70°C", "These cables can withstand a conductor operating temperature of 90°C", "These cables can withstand a maximum conductor operating temperature of 70°C", "These cables can withstand an ambient operating temperature of 90°C"], "answer": 1, "exp": "Thermosetting insulated cables, such as XLPE types, commonly have a maximum conductor operating temperature of 90°C. This refers to the conductor temperature, not the surrounding ambient temperature."}, {"q": "Which statement is true regarding PVC/PVC flat profile cable (twin and earth)?", "choices": ["It must be protected in trunking", "The cable can be clipped direct to the surface", "It must be protected within conduit", "This cable must be embedded into the building fabric"], "answer": 1, "exp": "PVC/PVC twin and earth can be clipped direct where the environment and risk of damage are suitable. It does not always have to be installed in trunking, conduit or embedded in the building fabric."}, {"q": "Which statement is true regarding the termination of MICC cable?", "choices": ["The cable should never be installed without sheathing", "The cable is prone to mechanical damage", "The cable must be run alongside an additional circuit protective conductor (CPC)", "It is best practice to cut the end off the cable when terminating due to moisture penetration"], "answer": 3, "exp": "MICC insulation is mineral based and can absorb moisture when the end is exposed. Cutting back the end before terminating helps remove any moisture-contaminated section and gives a better termination."}, {"q": "Which statement is true regarding SWA cable?", "choices": ["SWA can be buried if enclosed in conduit", "It must only be installed where it can be seen", "It must not be buried", "It can be buried direct into the ground"], "answer": 3, "  limitations here."}, {"q": "One advantage of using an in-line (through) crimp is:", "choices": ["It can be identified by its colour", "It is re-usable", "It does not need to be accessible", "You do not need any tools to fit it"], "answer": 2, "exp": "A correctly made crimped joint is treated as a permanent connection, so it does not need to remain accessible in the same way as a screw terminal joint. It is not normally reusable and it requires the correct crimping tool."}, {"q": "An advantage of a soldered connection is that:", "choices": ["Soldered joints can be used on aluminium conductors", "The joint does not need to be accessible for inspection", "Soldered joints do not need any special skills to make", "Soldered joints are the strongest method of fastening"], "answer": 1, "exp": "A properly made soldered joint is a permanent joint, so it does not need to be accessible for inspection like many mechanical screw connections. However, soldering does require skill and is not normally considered the strongest mechanical fastening method."}, {"q": "One limitation of insulation displacement termination, such as an RJ45 plug, is that it:", "choices": ["Would require complete removal and replacement if unsuccessfully terminated", "Needs to be accessible", "Needs to be tested for insulation resistance (IR)", "Is not classed as a permanent joint"], "answer": 0, "exp": "Insulation displacement contacts bite into the conductor during termination. If the termination is poor, the plug or connector usually has to be removed and replaced rather than reused."}, {"q": "One test method used to ensure the termination is electrically sound is:", "choices": ["An insulation resistance test", "A 3-phase rotation test", "A continuity test", "A prospective fault current test"], "answer": 2, "exp": "A continuity test confirms that the conductor path through the termination is complete and electrically connected. Insulation resistance tests check separation between conductors, not the soundness of one connection."}, {"q": "After making a connection of a conductor to a terminal, one would:", "choices": ["Gently tug the conductor to check for security", "Immediately test the conductor for continuity", "Immediately test the conductor for insulation resistance (IR)", "Remove the conductor and re-terminate it"], "answer": 0, "exp": "A gentle tug test checks that the conductor is mechanically secure in the terminal. Electrical testing can follow, but the first practical check is that the conductor has not been left loose."}, {"q": "A loose mechanical joint would create:", "choices": ["Vibration", "A high resistive joint", "A low resistive joint", "A low reading in ohms"], "answer": 1, "exp": "A loose joint reduces contact pressure and increases resistance at the connection. High resistance can cause heating, arcing and possible failure."}, {"q": "Corrosion can lead to:", "choices": ["A low ohms reading", "Vibration", "A low resistive joint", "A high resistive joint"], "answer": 3, "exp": "Corrosion increases contact resistance because it creates a poor conducting layer at the joint. This can cause overheating and unreliable operation."}];
let current=0, firstCorrect=0, attempted=Array(questions.length).fill(false), solved=false;
const app=document.getElementById('app'); const letters=['A','B','C','D']; const cls=['a','b','c','d'];
function render(){ const q=questions[current]; solved=false; app.innerHTML=`<section class="card"><div class="progress">Question ${current+1} of ${questions.length}</div><div class="question">${escapeHTML(q.q)}</div>${q.images?`<div class="images">${q.images.map(im=>`<div class="imgbox"><img src="${im.src}" alt="${escapeHTML(im.label)}"><span>${escapeHTML(im.label)}</span></div>`).join('')}</div>`:''}<div class="choices">${q.choices.map((c,i)=>`<button class="choice ${cls[i]}" data-i="${i}"><span class="letter">${letters[i]}.</span>${escapeHTML(c)}</button>`).join('')}</div><div id="feedback" class="feedback"></div><div class="nav"><button id="next" class="next" disabled>${current===questions.length-1?'Finish Quiz':'Next Question'}</button></div></section>`; document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',choose)); document.getElementById('next').addEventListener('click',next); }
function choose(e){ if(solved) return; const btn=e.currentTarget, i=Number(btn.dataset.i), q=questions[current], fb=document.getElementById('feedback'); if(!attempted[current]) attempted[current]=true; if(i===q.answer){ solved=true; if(!document.querySelector('.choice.wrong')) firstCorrect++; btn.classList.add('correct'); document.querySelectorAll('.choice').forEach(b=>b.disabled=true); fb.innerHTML=`<div><span class="icon">👍</span><strong>Correct.</strong></div><div class="explain">${escapeHTML(q.exp)}</div>`; document.getElementById('next').disabled=false; } else { btn.classList.add('wrong'); btn.disabled=true; fb.innerHTML=`<div><span class="icon">👎</span><strong>Not correct yet.</strong> Try another answer.</div>`; } }
function next(){ if(current<questions.length-1){current++; render();} else {summary();} }
function summary(){ const pct=Math.round(firstCorrect/questions.length*100); app.innerHTML=`<section class="card summary"><h2>Quiz Completed</h2><div class="score">${pct}%</div><p>You answered <strong>${firstCorrect}</strong> out of <strong>${questions.length}</strong> questions correctly on the first attempt.</p><button class="restart" onclick="location.reload()">Restart Quiz</button></section>`; }
function escapeHTML(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
render();
</script></body></html>
